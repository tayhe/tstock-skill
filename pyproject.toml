[project]
name = "tstock-skills"
version = "0.1.0"
description = "A股智能投资分析系统"
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.14.0",
    "mootdx>=0.11.7",
    "pandas>=2.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
baostock = ["baostock>=0.8.8"]

[tool.setuptools.packages.find]
include = ["tstock*", "config*"]
